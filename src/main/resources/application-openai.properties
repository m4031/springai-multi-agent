spring.application.name=MultiAIAgent

spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini

# The google-genai starter is on the classpath for the 'gemini' profile. Keep
# its chat autoconfig from activating here (it would need GEMINI_API_KEY) by
# pinning chat to openai above.

## Application logging
logging.level.root=INFO
logging.level.com.app.multiagent=DEBUG

## Logging for Spring AI chat-client advisors
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
