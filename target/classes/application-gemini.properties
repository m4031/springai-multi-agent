spring.application.name=MultiAIAgent

# ---- Chat / reasoning: Google Gemini (Spring AI ChatClient) ----
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

# The OpenAI starter is on the classpath for the 'openai' profile. Its non-chat
# model autoconfigs default to activating (matchIfMissing=true) and would try to
# build an OpenAI client without an API key, failing context startup. Disable
# them here so the gemini profile only wires up the Google chat model.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# ---- Speech-to-text & Text-to-speech: Google GenAI SDK (custom services) ----
# Gemini provides no Spring AI TranscriptionModel/TextToSpeechModel, so
# SpeechToTextService and TextToSpeechService call the Google GenAI Java SDK
# directly using these settings (see GeminiClientConfig).
app.gemini.stt.model=gemini-3.8-flash
app.gemini.tts.model=gemini-3.8-flash-tts
app.gemini.tts.voice=Kore

logging.level.org.springframework.ai.chat.client.advisor=DEBUG


